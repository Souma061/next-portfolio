<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161E2B" />
      <stop offset="50%" stop-color="#0F141D" />
      <stop offset="100%" stop-color="#070A0E" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA459" />
      <stop offset="50%" stop-color="#E86B1C" />
      <stop offset="100%" stop-color="#B84A0F" />
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E86B1C" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E86B1C" stop-opacity="0.05" />
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#232E40" stroke-width="6" />
  
  <!-- Subtle Internal Circuit Grid / Architecture Lines -->
  <g opacity="0.35" stroke="#E86B1C" stroke-width="2" stroke-linecap="round">
    <line x1="80" y1="120" x2="180" y2="120" />
    <circle cx="180" cy="120" r="4" fill="#E86B1C" />
    <line x1="180" y1="120" x2="220" y2="80" />
    <circle cx="220" cy="80" r="4" fill="#E86B1C" />

    <line x1="432" y1="392" x2="332" y2="392" />
    <circle cx="332" cy="392" r="4" fill="#E86B1C" />
    <line x1="332" y1="392" x2="292" y2="432" />
    <circle cx="292" cy="432" r="4" fill="#E86B1C" />
  </g>

  <!-- Amber Glowing Accent Outer Border Accent -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="url(#amberGrad)" stroke-width="4" opacity="0.4" />

  <!-- Distributed Node Ring -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#232E40" stroke-width="3" stroke-dasharray="12 12" opacity="0.7" />

  <!-- Monogram Glyph: "SG" (Soumabrata Ghosh) Styled with Systems Terminal Nodes -->
  <!-- "S" Path -->
  <path d="M 224 168
           L 156 168
           C 134 168 120 182 120 204
           L 120 216
           C 120 238 134 252 156 252
           L 204 252
           C 226 252 240 266 240 288
           L 240 308
           C 240 330 226 344 204 344
           L 120 344"
        fill="none"
        stroke="url(#amberGrad)"
        stroke-width="34"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#amberGlow)" />

  <!-- "G" Path -->
  <path d="M 392 188
           C 376 172 352 168 328 168
           C 292 168 272 196 272 256
           C 272 316 292 344 328 344
           C 356 344 380 336 392 312
           L 392 260
           L 332 260"
        fill="none"
        stroke="#F3E6D5"
        stroke-width="34"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Terminal Kernel Interlink Node -->
  <circle cx="256" cy="256" r="10" fill="#E86B1C" />
  <circle cx="256" cy="256" r="20" fill="none" stroke="#E86B1C" stroke-width="2" opacity="0.6" />

  <!-- Top Right Active Telemetry / Status Indicator -->
  <circle cx="410" cy="102" r="14" fill="#E86B1C" filter="url(#amberGlow)" />
  <circle cx="410" cy="102" r="8" fill="#FFF2E8" />
</svg>